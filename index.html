<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARTEX — Калькулятор имплантов</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">

  <header class="site-header">
    <div class="container">
      <div class="row align-items-center py-3">
        <div class="col-12 text-center text-md-left">
          <a href="#" class="logo-link d-inline-block align-middle mr-2">
            <img src="logo.png" alt="Логотип" class="logo">
          </a>
          <h1 class="m-0 d-inline-block align-middle">ARTEX</h1>
        </div>
      </div>
    </div>
  </header>

  <main class="container py-4 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <section id="calc" class="block mt-4">
          <h2>Терминал заказа имплантов</h2>

          <form id="calc-form" class="mt-3">
            
            <div class="form-group">
              <label class="d-block font-weight-bold text-danger">Выберите класс кибер-импланта:</label>
              
              <div class="form-check">
                <input type="radio" name="serviceType" value="optics" id="type1" class="form-check-input" checked>
                <label for="type1" class="form-check-label">Кироши Оптикс (Оптика) — 10 000 €$</label>
              </div>
              
              <div class="form-check">
                <input type="radio" name="serviceType" value="deck" id="type2" class="form-check-input">
                <label for="type2" class="form-check-label">Кибердек (Нейроинтерфейс) — 20 000 €$</label>
              </div>
              
              <div class="form-check">
                <input type="radio" name="serviceType" value="arms" id="type3" class="form-check-input">
                <label for="type3" class="form-check-label">Горилла Армс (Руки) — 30 000 €$</label>
              </div>
            </div>

            <div class="form-group d-none" id="options-block">
              <label for="serviceOption">Модификация Кибердека:</label>
              <select id="serviceOption" class="form-control">
                <option value="0">Стандартный чип (+0 €$)</option>
                <option value="5000">Модуль RAM MK.2 (+5 000 €$)</option>
                <option value="10000">Модуль RAM MK.3 (+10 000 €$)</option>
              </select>
            </div>

            <div class="form-group d-none" id="property-block">
              <div class="form-check">
                <input type="checkbox" id="serviceProperty" class="form-check-input">
                <label for="serviceProperty" class="form-check-label">Термальный модификатор (+15 000 €$)</label>
              </div>
            </div>

            <div class="form-group">
              <label for="quantity">Количество имплантов:</label>
              <!-- Вот здесь стоит защита от минуса прямо в HTML -->
              <input type="number" id="quantity" class="form-control" value="1" min="1" oninput="this.value = Math.abs(this.value)">
            </div>

          </form>

          <hr style="border-color: #555;">
          <p id="calc-result" class="font-weight-bold" style="color: #ffb3b3; font-size: 24px;">Итого: 10 000 €$</p>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container py-3 text-center">
      (c) ARTEX, 2026
    </div>
  </footer>

</body>
</html>
