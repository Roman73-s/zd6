<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARTEX — Калькулятор (ЛР6)</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">

  <header class="site-header">
    <div class="container">
      <div class="row align-items-center py-3">
        <div class="col-12 col-md-6 text-center text-md-left mb-3 mb-md-0">
          <a href="#" class="logo-link d-inline-block align-middle mr-2">
            <img src="logo.png" alt="Логотип" class="logo">
          </a>
          <h1 class="m-0 d-inline-block align-middle">ARTEX</h1>
        </div>
      </div>
    </div>
  </header>

  <main class="container py-4 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <section id="calc" class="block mt-4">
          <h2>Калькулятор стоимости услуги</h2>

          <form id="calc-form" class="mt-3">
            
            <!-- Радиокнопки (Типы услуг) -->
            <div class="form-group">
              <label class="d-block font-weight-bold">Тип услуги:</label>
              <div class="form-check">
                <input type="radio" name="serviceType" value="type1" id="type1" class="form-check-input" checked>
                <label for="type1" class="form-check-label">Базовая (без опций) — 1000 ₽</label>
              </div>
              <div class="form-check">
                <input type="radio" name="serviceType" value="type2" id="type2" class="form-check-input">
                <label for="type2" class="form-check-label">С опциями — 2000 ₽</label>
              </div>
              <div class="form-check">
                <input type="radio" name="serviceType" value="type3" id="type3" class="form-check-input">
                <label for="type3" class="form-check-label">С дополнительным свойством — 3000 ₽</label>
              </div>
            </div>

            <!-- Селект (Опции для 2-го типа) -->
            <div class="form-group d-none" id="options-block">
              <label for="serviceOption">Выберите опцию:</label>
              <select id="serviceOption" class="form-control">
                <option value="0">Без дополнительной опции (+0 ₽)</option>
                <option value="500">Опция А (+500 ₽)</option>
                <option value="1000">Опция Б (+1000 ₽)</option>
              </select>
            </div>

            <!-- Чекбокс (Свойство для 3-го типа) -->
            <div class="form-group d-none" id="property-block">
              <div class="form-check">
                <input type="checkbox" id="serviceProperty" class="form-check-input">
                <label for="serviceProperty" class="form-check-label">Дополнительное свойство (+1500 ₽)</label>
              </div>
            </div>

            <!-- Количество -->
            <div class="form-group">
              <label for="quantity">Количество:</label>
              <input type="number" id="quantity" class="form-control" value="1" min="1">
            </div>

          </form>

          <hr style="border-color: #555;">
          <p id="calc-result" class="font-weight-bold" style="color: #ffb3b3; font-size: 24px;">Итого: 1000 ₽</p>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container py-3 text-center">
      (c) ARTEX, 2026
    </div>
  </footer>

</body>
</html>
